version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # .node-version pins Node 22, so the typings stay on 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 drops the compiler API (ts.readConfigFile, ts.sys) that packages/contract uses, and typescript-eslint does not support it yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # i18next 26.7 changes the interpolation order the committed Rust vectors pin, and sdk 1.32 changes the MCP error text: the Rust port learns it first.
      - dependency-name: "i18next"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@modelcontextprotocol/sdk"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      npm-site:
        patterns: ["*"]
    ignore:
      # .node-version pins Node 22, so the typings stay on 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 drops the compiler API (ts.readConfigFile, ts.sys) that packages/contract uses, and typescript-eslint does not support it yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
