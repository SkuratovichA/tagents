name: rust

# The Rust workspace and everything its tests compare it with: the shell file `lib/tagents/names.sh` that three Rust tests run, the shared CLI spec and its generated `contract.json` (which the MCP tests read), the node CLI that stays the reference, and the parity suite. The `rust` job runs on Linux and on macOS; the `release-path` job, on Linux, holds the version gate and the two shell suites of the release path (the packaging script and the installer's fetch), and `tests/release.sh` reads `release.yml` and `rust.yml`, so both are listed; the other shell suites for `tagents` are not run here, so those files are not listed.
on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - lib/tagents/names.sh
      - contract.json
      - crates/**
      - spec/**
      - packages/core/**
      - packages/mcp/**
      - packages/knowledge/**
      - packages/notify/**
      - tests/rust-parity.sh
      - tests/rust-mcp-parity.sh
      - tests/rust-mcp-parity-driver.mts
      - tests/lib/mcp-parity.sh
      - tests/rust-knowledge-parity.sh
      - tests/rust-knowledge-parity-driver.mts
      - tests/rust-notify-parity.sh
      - tests/rust-notify-parity-driver.mts
      - .node-version
      - package.json
      - pnpm-lock.yaml
      - tests/rust-parity-seed.mts
      - tests/rust-notify-vectors.mts
      - tests/rust-notify-vectors/**
      - tests/rust-plugin-parity.sh
      - tests/rust-plugin-vectors.mts
      - tests/rust-plugin-vectors/**
      - tests/rust-knowledge-vectors.mts
      - tests/rust-knowledge-vectors/**
      - tests/rust-knowledge-embed.mts
      - .github/workflows/rust.yml
      - .github/workflows/release.yml
      - .github/scripts/core-release.sh
      - tests/release.sh
      - tests/install.sh
      - tests/knowledge-launcher.sh
      - packages/knowledge/bin/knowledge-mcp
      - install.sh
      - tests/rust-session-parity.sh
      - tests/rust-session-parity-driver.mts
      - tests/rust-session-vectors.mts
      - tests/rust-session-vectors/**
      - tests/lib/parity.sh
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - lib/tagents/names.sh
      - contract.json
      - crates/**
      - spec/**
      - packages/core/**
      - packages/mcp/**
      - packages/knowledge/**
      - packages/notify/**
      - tests/rust-parity.sh
      - tests/rust-mcp-parity.sh
      - tests/rust-mcp-parity-driver.mts
      - tests/lib/mcp-parity.sh
      - tests/rust-knowledge-parity.sh
      - tests/rust-knowledge-parity-driver.mts
      - tests/rust-notify-parity.sh
      - tests/rust-notify-parity-driver.mts
      - .node-version
      - package.json
      - pnpm-lock.yaml
      - tests/rust-parity-seed.mts
      - tests/rust-notify-vectors.mts
      - tests/rust-notify-vectors/**
      - tests/rust-plugin-parity.sh
      - tests/rust-plugin-vectors.mts
      - tests/rust-plugin-vectors/**
      - tests/rust-knowledge-vectors.mts
      - tests/rust-knowledge-vectors/**
      - tests/rust-knowledge-embed.mts
      - .github/workflows/rust.yml
      - .github/workflows/release.yml
      - .github/scripts/core-release.sh
      - tests/release.sh
      - tests/install.sh
      - tests/knowledge-launcher.sh
      - packages/knowledge/bin/knowledge-mcp
      - install.sh
      - tests/rust-session-parity.sh
      - tests/rust-session-parity-driver.mts
      - tests/rust-session-vectors.mts
      - tests/rust-session-vectors/**
      - tests/lib/parity.sh

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the node dependencies, which the smoke test of the MCP server and the parity suites run against
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints, tests included
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit and integration tests
        run: cargo test --workspace --locked
      - name: Build the node CLI the Rust binary is compared with
        run: pnpm build
      - name: The notify vectors node writes are the ones committed, so a change to a function the Rust daemon copies fails here until the copy follows
        run: |
          node tests/rust-notify-vectors.mts
          git diff --exit-code crates/tagents-core/tests/fixtures/notify-vectors.json
      - name: The plugin vectors node writes are the ones committed, so a change to the config writer, the package resolver or a message the Rust verbs copy fails here until the copy follows
        run: |
          node tests/rust-plugin-vectors.mts
          git diff --exit-code crates/tagents-core/tests/fixtures/plugin-vectors.json
      - name: The knowledge vectors node writes are the ones committed, so a change to the index, the search or the usage store fails here until the Rust copy follows
        run: |
          node tests/rust-knowledge-vectors.mts
          git diff --exit-code crates/tagents-core/tests/fixtures/knowledge-vectors.json
      - name: The session vectors node writes are the ones committed, so a change to the reference schema, the stream reader, the argument or environment builders or the printing of a number or a string fails here until the Rust copy follows
        run: |
          node tests/rust-session-vectors.mts
          git diff --exit-code crates/tagents-core/tests/fixtures/session-vectors.json
      - name: The tool list and the two sentences the Rust knowledge server embeds are the ones node has, so a changed tool, description or text fails here until they are written again
        run: |
          node tests/rust-knowledge-embed.mts
          git diff --exit-code crates/tagents-core/src/knowledge/tools.json crates/tagents-core/src/knowledge/texts.json
      - name: Parity with the node CLI, byte for byte
        run: bash tests/rust-parity.sh
      - name: Parity of the MCP server with the node one, byte for byte
        run: bash tests/rust-mcp-parity.sh
      - name: Parity of the knowledge MCP server and its daemon with the node ones, transcripts compared byte for byte
        run: bash tests/rust-knowledge-parity.sh
      - name: Parity of the notify daemon with the node one, byte for byte
        run: bash tests/rust-notify-parity.sh
      - name: Parity of plugin add and plugin remove with the node ones, files and exit codes included
        run: bash tests/rust-plugin-parity.sh
      - name: Parity of the session verbs with the node ones, state and exit codes included
        run: bash tests/rust-session-parity.sh
      - name: The program a session starts over a scratch install, with the built binary and the built node server
        run: bash tests/knowledge-launcher.sh

  # A change to what the tagents-core binary is built from must raise the workspace version (docs/architecture/rust-core.md, "How a release is made"). Every such input is in the paths above, so a pull request that breaks the rule always runs this job. The history is deep because the gate compares with the merge base.
  release-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The workspace version goes up with every change to the binary
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: sh .github/scripts/core-release.sh gate "origin/$BASE_REF"
      - name: The packaging script, the version reader and the gate
        run: bash tests/release.sh
      - name: The installer, including the prebuilt tagents-core it fetches
        run: bash tests/install.sh
