name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every action is pinned by commit SHA
        run: |
          if grep -n -E '^\s*-?\s*uses: ' .github/workflows/*.yml | grep -v -E '@[0-9a-f]{40} # v[0-9]' | grep -v 'uses: \./'; then
            echo 'the lines above are not pinned by commit SHA' >&2
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the dependencies and build the packages
        run: pnpm install --frozen-lockfile
      - name: The plugin contract matches the code
        run: pnpm plugin:check
      - name: The specs are valid OpenSpec
        env:
          DO_NOT_TRACK: '1'
          OPENSPEC_TELEMETRY: '0'
        run: pnpm spec:check
      - name: Install the Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate the manifests and the skill
        run: |
          for target in . .claude-plugin/plugin.json skills; do
            claude plugin validate "$target" --strict || exit 1
          done
