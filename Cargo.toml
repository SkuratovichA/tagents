[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/tagents-core"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/SkuratovichA/tagents"
publish = false

[workspace.dependencies]
# Internal crates.
tagents-spec = { path = "crates/tagents-spec" }

# serde and serde_json read the language-neutral CLI spec (spec/cli/tagents-core.json). No other parser is in the tree.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
