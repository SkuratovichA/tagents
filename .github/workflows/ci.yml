name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Every action is pinned by commit SHA
        run: |
          if grep -n -E '^\s*-?\s*uses: ' .github/workflows/*.yml | grep -v -E '@[0-9a-f]{40} # v[0-9]' | grep -v 'uses: \./'; then
            echo 'the lines above are not pinned by commit SHA' >&2
            exit 1
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the dependencies and build the packages
        run: pnpm install --frozen-lockfile
      - name: The plugin contract matches the code
        run: pnpm plugin:check
      - name: The specs are valid OpenSpec
        env:
          DO_NOT_TRACK: '1'
          OPENSPEC_TELEMETRY: '0'
        run: pnpm spec:check
      - name: Install the Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate the manifests and the skill
        run: |
          for target in . .claude-plugin/plugin.json skills; do
            claude plugin validate "$target" --strict || exit 1
          done
