name: site

# The one-page site in site/ and the documentation in docs/, built and checked together and published on GitHub Pages as one deployment: the page at / and the documentation under /docs/. A pull request builds and checks both and publishes nothing; a push to main publishes. It runs when the site, the documentation, this file or the pinned Node version changes.
on:
  push:
    paths:
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/site.yml'
      - '.node-version'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/site.yml'
      - '.node-version'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every build of this workflow is the build that gets published, so the address of the site (canonical links, sitemap, CNAME) is in each of them.
  SITE_DOMAIN: tagents.arstoien.com

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm version is read from the packageManager field of site/package.json, which is the version of the repository root too.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json

      # The build and capture scripts are TypeScript that Node runs directly, which needs Node 22.18 or newer; the version is the one the repository pins in .node-version.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # VitePress builds the documentation with its base set to /docs/ (docs/.vitepress/config.mjs), and the copy puts it where the link check and the deployment expect it. The check reads the pages of the site and only resolves the links into docs/.
      - run: pnpm docs:build
        working-directory: .
      - run: mkdir -p site/dist/client/docs && cp -R docs/.vitepress/dist/. site/dist/client/docs/
        working-directory: .
      - run: pnpm check:links

      # Pages serves the artifact as it is built, without Jekyll. Pull requests run on refs/pull/N/merge, so only a push or a manual run on main uploads.
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist/client

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deployment at a time, and a running one is never cancelled by a newer one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
