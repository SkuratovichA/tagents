schema: spec-driven

# Constraints an agent cannot infer by reading the code.
context: |
  The dashboard scripts run on macOS's /bin/bash 3.2 and the agent-state hook is POSIX sh: no bash 4 features (associative arrays, coproc, wait -n, a fractional read -t).
  pnpm is the only package manager: install with pnpm and run one-off CLIs with pnpm dlx.
  Every shell suite under tests/ runs on a scratch tmux server, one suite at a time, as env -u TMUX -u TMUX_PANE TMUX_TMPDIR="$(mktemp -d)" bash tests/<suite>.sh. A suite never reaches the tmux server it was started from.
  contract.json and skills/tagents/references/ are generated by pnpm plugin:gen, which the pre-commit hook runs; they are never edited by hand.
  Prose in specs, proposals, designs and docs is one paragraph per line, never hard-wrapped.
  LEARNING.md records mistakes and how they were fixed: read it before a change, add to it after one.

rules:
  specs:
    - Specify what a user or another component can observe (keys, verbs, flags, exit codes, environment variables, config keys, files other programs read and their formats, tmux options other parts read, MCP tools), never internal function names or implementation steps.
  tasks:
    - Name the test suite or package test that proves each task.
