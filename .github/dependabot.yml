version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # .node-version pins Node 22, so the typings stay on 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 drops the compiler API (ts.readConfigFile, ts.sys) that packages/contract uses, and typescript-eslint does not support it yet.
      - dependency-name: "typescript"
        versions: [">= 7"]
      # i18next 26.7 changes the interpolation order and sdk 1.32 the MCP error text that the committed Rust parity vectors pin. Both come out once the vectors are frozen against the oracle tag (OpenSpec change rust-retire-node).
      - dependency-name: "i18next"
        versions: [">= 26.7"]
      - dependency-name: "@modelcontextprotocol/sdk"
        versions: [">= 1.32"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      npm-site:
        patterns: ["*"]
    ignore:
      # .node-version pins Node 22, so the typings stay on 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: "typescript"
        versions: [">= 7"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
