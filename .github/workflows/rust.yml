name: rust

# The Rust workspace and everything its tests compare it with: the shared CLI spec and its generated `contract.json` (which the MCP tests read), the node CLI that stays the reference, and the parity suite. The `rust` job runs on Linux and on macOS; the `release-path` job, on Linux, holds the version gate and the two shell suites of the release path (the packaging script and the installer's fetch), and `tests/release.sh` reads `release.yml` and `rust.yml`, so both are listed; the other shell suites for `tagents` are not run here, so those files are not listed.
on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - contract.json
      - crates/**
      - spec/**
      - packages/core/**
      - packages/mcp/**
      - tests/rust-parity.sh
      - tests/rust-mcp-parity.sh
      - tests/rust-mcp-parity-driver.mts
      - .node-version
      - package.json
      - pnpm-lock.yaml
      - tests/rust-parity-seed.mts
      - .github/workflows/rust.yml
      - .github/workflows/release.yml
      - .github/scripts/core-release.sh
      - tests/release.sh
      - tests/install.sh
      - install.sh
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - contract.json
      - crates/**
      - spec/**
      - packages/core/**
      - packages/mcp/**
      - tests/rust-parity.sh
      - tests/rust-mcp-parity.sh
      - tests/rust-mcp-parity-driver.mts
      - .node-version
      - package.json
      - pnpm-lock.yaml
      - tests/rust-parity-seed.mts
      - .github/workflows/rust.yml
      - .github/workflows/release.yml
      - .github/scripts/core-release.sh
      - tests/release.sh
      - tests/install.sh
      - install.sh

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the node dependencies, which the smoke test of the MCP server and the parity suites run against
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints, tests included
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit and integration tests
        run: cargo test --workspace --locked
      - name: Build the node CLI the Rust binary is compared with
        run: pnpm build
      - name: Parity with the node CLI, byte for byte
        run: bash tests/rust-parity.sh
      - name: Parity of the MCP server with the node one, byte for byte
        run: bash tests/rust-mcp-parity.sh

  # A change to what the tagents-core binary is built from must raise the workspace version (docs/architecture/rust-core.md, "How a release is made"). Every such input is in the paths above, so a pull request that breaks the rule always runs this job. The history is deep because the gate compares with the merge base.
  release-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The workspace version goes up with every change to the binary
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: sh .github/scripts/core-release.sh gate "origin/$BASE_REF"
      - name: The packaging script, the version reader and the gate
        run: bash tests/release.sh
      - name: The installer, including the prebuilt tagents-core it fetches
        run: bash tests/install.sh
